[package]
name = "mesh-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared mesh topology and routing extracted from GrepMesh"

[features]
default = []
transport = ["dep:reqwest", "dep:tokio", "dep:futures"]
service = ["dep:tokio"]

[dependencies]
anyhow = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["time", "net", "io-util", "rt", "sync", "signal", "macros"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false
strip = "symbols"
codegen-units = 16

[profile.test]
debug = 0
incremental = false
strip = "symbols"
codegen-units = 16

[[bin]]
name = "mesh-core-service"
path = "src/bin/service.rs"
required-features = ["service"]
